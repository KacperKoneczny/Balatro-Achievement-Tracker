<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balatro Achievement Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/progress.css">
    <link rel="stylesheet" href="css/popup.css">
    <link rel="stylesheet" href="css/background.css">
</head>
<body>
    <!-- The animated swirl behind the page, drawn by background.js.
         aria-hidden hides it from screen readers because it's only decoration. -->
    <canvas class="background" aria-hidden="true"></canvas>
    <main class="page">
        <header class="title">
            <h1>Balatro</h1>
            <p>Achievement Tracker</p>
        </header>
        <div class="progress" role="progressbar" aria-label="Achievements completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill"></div>
            <span class="progress-text">0%</span>
        </div>
        <div class="grid">
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_01.webp" alt="Ante Up!" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_02.webp" alt="Ante Upper!" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_03.webp" alt="Heads Up" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_04.webp" alt="Low Stakes" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_05.webp" alt="Mid Stakes" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_06.webp" alt="High Stakes" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_07.webp" alt="Card Player" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_08.webp" alt="Card Discarder" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_09.webp" alt="Nest Egg" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_10.webp" alt="Flushed" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_11.webp" alt="Speedrunner" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_12.webp" alt="ROI" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_13.webp" alt="Shattered" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_14.webp" alt="Royale" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_15.webp" alt="Retrograde" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_16.webp" alt="10K" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_17.webp" alt="1,000K" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_18.webp" alt="100,000K" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_19.webp" alt="Tiny Hands" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_20.webp" alt="Big Hands" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_21.webp" alt="You Get What You Get" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_22.webp" alt="Rule Bender" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_23.webp" alt="Rule Breaker" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_24.webp" alt="Legendary" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_25.webp" alt="Astronomy" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_26.webp" alt="Cartomancy" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_27.webp" alt="Clairvoyance" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_28.webp" alt="Extreme Couponer" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_29.webp" alt="Completionist" class="image">
            </button>
            <button type="button" aria-haspopup="dialog">
                <img src="assets/achievements/Bal_30.webp" alt="Completionist+" class="image">
            </button>
            <!-- The last achievement gets a big tile of its own (see .final in style.css). -->
            <button type="button" aria-haspopup="dialog" class="final">
                <img src="assets/achievements/Bal_31.webp" alt="Completionist++" class="image">
            </button>
        </div>
    </main>
    <!-- The popup that opens when an achievement is clicked. It stays hidden until
         onclick.js fills it in and calls showModal(). -->
    <dialog class="popup" aria-labelledby="popup-name" tabindex="-1">
        <div class="popup-content">
            <button type="button" class="popup-close" aria-label="Close">X</button>
            <img alt="" class="popup-image">
            <h2 id="popup-name" class="popup-name"></h2>
            <hr>
            <p class="popup-description"></p>
            <hr>
            <p class="popup-tip"></p>
            <hr>
            <p class="popup-reward"></p>
            <button type="button" class="popup-complete" aria-pressed="false">Complete</button>
        </div>
    </dialog>
    <!-- Order matters: onclick.js uses achievements (from achievements.js)
         and updateProgress (from progress.js), so those load first. -->
    <script src="js/achievements.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/onclick.js"></script>
    <script src="js/background.js"></script>
</body>
</html>
